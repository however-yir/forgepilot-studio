name: Required Compatibility Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependabot:
    name: Dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify Dependabot configuration
        run: test -f .github/dependabot.yml

  update-uv-graph:
    name: update-uv-graph
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility check
        run: echo "update-uv-graph compatibility check"

  runtime-image-legacy:
    name: "Build Runtime Image (nikolaik/python-nodejs:python3.12-nodejs22-slim, nikolaik, linux/amd64,linux..."
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility check
        run: echo "legacy runtime image required check compatibility"
